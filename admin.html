<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de banner - Techland</title>
<style>
  :root{ --ink:#1a1a1a; --muted:#6b7280; --red:#e02020; --bg:#f4f2ef; }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:2rem 1rem;}
  .wrap{max-width:480px;margin:0 auto;background:#fff;border-radius:12px;padding:2rem;box-shadow:0 2px 10px rgba(0,0,0,.06);}
  h1{font-size:1.3rem;margin:0 0 1.5rem;}
  label{display:block;font-size:.85rem;font-weight:600;margin:1rem 0 .35rem;}
  input[type="password"], input[type="url"], input[type="text"]{
    width:100%;padding:.6rem .7rem;border:1px solid #ddd;border-radius:8px;font-size:.95rem;
  }
